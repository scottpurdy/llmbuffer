[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmbuffer"
version = "0.1.0"
description = "Cache-optimized LLM conversation history management with static/dynamic system prompts, transition modes, and compaction hooks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "llmbuffer contributors" }]
keywords = ["llm", "prompt-caching", "conversation", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
transformers = ["transformers>=4.30"]
anthropic = [
    "anthropic>=0.30",
]
openai = [
    "openai>=1.30",
]

[dependency-groups]
dev = ["pytest>=7.0"]
notebook = ["jupyter>=1.0", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/scottpurdy/llmbuffer"
Repository = "https://github.com/scottpurdy/llmbuffer"
Issues = "https://github.com/scottpurdy/llmbuffer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbuffer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
